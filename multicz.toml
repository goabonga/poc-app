# multicz.toml - per-binary versioning, changelogs and tags for poc-app.
# Docs: https://goabonga.github.io/multicz/
#
# Two independent CLI binaries, each a multicz component. `paths` is a
# curated glob; `[plugins.go-deps]` gives each component a second chance via
# the compiler-verified import graph (go list -deps) when a change lands in
# an internal/ package the glob doesn't name.

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
state_file = ".multicz/state.json"
# go.mod / go.sum are claimed by both binaries: a dependency bump changes
# what each of them links, so it should bump both. See infrastructure's
# multicz.toml for the same reasoning at a larger scale.
overlap_policy = "all"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[plugins.go-deps]
[plugins.go-deps.packages]
greeter = "./cmd/greeter"
pinger = "./cmd/pinger"

[components.greeter]
paths = ["cmd/greeter/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/greeter/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/greeter/CHANGELOG.md"

[components.pinger]
paths = ["cmd/pinger/**", "go.mod", "go.sum"]
bump_files = [
    { file = "cmd/pinger/version.go", key = "regex:Version\\s*=\\s*\"([^\"]+)\"" },
]
changelog = "cmd/pinger/CHANGELOG.md"
