# multicz.toml - per-binary versioning, changelogs and tags for poc-app.
# Docs: https://goabonga.github.io/multicz/
#
# Two independent CLI binaries, each a multicz component declared in its own
# cmd/<name>/multicz.component.toml (paths relative to that directory).
# `[plugins.go-deps]` gives each component a second chance via the
# compiler-verified import graph (go list -deps) when a change lands in an
# internal/ package its own directory doesn't hold.

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[plugins.go-deps]
[plugins.go-deps.packages]
hello = "./cmd/hello"
pinger = "./cmd/pinger"

[[component.path]]
path = "cmd/*"

# go.mod and go.sum sit above every cmd/<name> directory, out of reach of a
# component file, so they are a component of their own that both binaries
# depend on: a dependency bump patches `go-modules`, which cascades a patch
# to hello and pinger. It has no binary and no release of its own.
[components.go-modules]
paths = ["go.mod", "go.sum"]
