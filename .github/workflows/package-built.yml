name: package-built

# Receives the callback poc-apt sends as soon as Launchpad has built the
# packages of one series. They are what the release ships: they are attached
# to the GitHub Release of the component's tag, which is still a draft. The
# notes are written once, by package-complete, when every series is over.
#
# client_payload:
#   component: "hello" | "pinger"
#   version:   the released version, e.g. "0.3.0"
#   series:    the Ubuntu series, e.g. "noble"
#   package:   the name of the package, e.g. "poc-hello"
#   debs:      the .deb files built, a JSON array of {series, arch, url, sha256}

on:
  repository_dispatch:
    types: [package-built]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      COMPONENT: ${{ github.event.client_payload.component }}
      VERSION: ${{ github.event.client_payload.version }}
      SERIES: ${{ github.event.client_payload.series }}
      PACKAGE: ${{ github.event.client_payload.package }}
      DEBS: ${{ github.event.client_payload.debs }}
    steps:
      - uses: actions/checkout@v7

      - name: Attach the packages Launchpad built
        run: |
          set -euo pipefail
          [[ "$COMPONENT" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::invalid component"; exit 1; }
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+~-]*$ ]] || { echo "::error::invalid version"; exit 1; }
          . scripts/release.sh
          tag="${COMPONENT}-v${VERSION}"
          id=$(release_id "$tag")
          [ -n "$id" ] || { echo "::error::no release for $tag"; exit 1; }
          package="${PACKAGE:-poc-${COMPONENT}}"
          mkdir -p debs
          count=0
          while IFS=$'\t' read -r name url sha256; do
            [ -n "$name" ] || continue
            # Only Launchpad serves them: nothing else is downloaded.
            [[ "$url" == https://launchpad.net/* ]] || { echo "::error::unexpected URL $url"; exit 1; }
            curl -fsSL -o "debs/$name" "$url"
            if [ -n "$sha256" ]; then
              echo "${sha256}  debs/${name}" | sha256sum --check --status \
                || { echo "::error::checksum mismatch for $name"; exit 1; }
            fi
            # Replaced when this run repeats, never piled up.
            release_attach "$id" "debs/$name" "$name"
            echo "attached $name"
            count=$((count + 1))
          done < <(python3 scripts/release_notes.py assets "$package" "$VERSION" "${DEBS:-[]}")
          echo "$count package(s) attached to $tag"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Packages of ${SERIES}: ${JOB_STATUS}"
            echo
            echo "| Architecture | File |"
            echo "| --- | --- |"
            python3 scripts/release_notes.py assets "${PACKAGE:-poc-${COMPONENT}}" "$VERSION" "${DEBS:-[]}" \
              | awk -F'\t' '{ split($1, f, "_"); a=f[4]; sub(/\.deb$/, "", a); print "| " a " | `" $1 "` |" }'
          } >> "$GITHUB_STEP_SUMMARY"
