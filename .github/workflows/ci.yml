name: ci

on:
  pull_request:
    # An issue branch collects the pull requests of its sub-issues before it
    # reaches main, so they are checked like the ones into main.
    branches: [main, "issue-*"]
  push:
    branches: [main]

# The quality jobs skip the `chore(release)` commit multicz pushes to main:
# the run that cut the release already validated the code it carries.

# `concurrency` cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # An explicit shell enables pipefail, so `| tee` keeps the tool's status.
    shell: bash

jobs:
  # multicz.toml sanity ahead of everything else: a broken config (a
  # component whose paths match nothing, a bump_files entry pointing at a
  # missing file, a plugin section that doesn't load) should fail fast
  # rather than surface later as a confusing release-job error.
  validate:
    name: validate multicz config
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/multicz-setup
      - run: multicz validate --strict

  lint:
    name: lint
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        # Lists the files gofmt would reformat; any listed file fails the step.
        run: |
          gofmt -l . | tee gofmt.txt
          test ! -s gofmt.txt
      - name: Summarize gofmt
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text gofmt gofmt.txt
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # The signed merge replays the commits through sign_commit.py, which
  # refuses an invalid subject; fail here, before the label is added.
  commit-subjects:
    name: commit subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_subject.py --range "$BASE_SHA..$HEAD_SHA"

  # Verify the two-line SPDX header on every Go, shell, Python and YAML file.
  license-headers:
    name: license headers
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers
        run: python3 scripts/add_license_header.py --path . --types go,sh,py,yml,yaml --check 2>&1 | tee headers.txt
      - name: Summarize license headers
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py headers headers.txt

  # Gated on lint rather than run in parallel with it: a build that doesn't
  # even gofmt cleanly isn't worth compiling and testing.
  test:
    name: test
    needs: [lint]
    if: needs.lint.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Run tests with coverage
        run: go test ./... -cover 2>&1 | tee gotest.txt
      - name: Summarize tests
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text "go test" gotest.txt

  # Release on main only: bump the versions, write the changelogs, create the
  # release commit and one tag per component and push them back. Gated on
  # every quality job; `needs` blocks on any upstream failure and skips the
  # `chore(release)` commit, whose quality jobs are skipped.
  #
  # The release commit and tags are GPG-signed when GPG_PRIVATE_KEY and
  # GPG_PASSPHRASE are configured, and pushed with the maintainer token
  # (AUTO_MERGE_PAT) when set, since the main-protection ruleset only lets
  # the maintainer push to main. Without them the release falls back to an
  # unsigned push with the workflow token.
  release:
    name: release
    needs: [validate, lint, license-headers, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      # The bumped components that ship a binary, "<component>:<version>"
      # separated by spaces. go-modules is versioned to cascade dependency
      # bumps and has nothing to build nor release.
      releases: ${{ steps.bump.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A push made with the workflow token cannot bypass the
          # main-protection ruleset.
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true
      - name: Check that main has not moved on
        # The release commit is made on the commit that triggered the run, and
        # the runs on main queue one after the other, but a push can land
        # while this one waited or runs. The run of that newer commit follows
        # this one and releases everything that is pending, so this one stands
        # aside (the push below also refuses, atomically, if main moves later).
        id: head
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main moved on to $latest: the run of that commit releases"
            {
              echo "## Release skipped"
              echo
              echo "\`main\` moved on to \`$latest\`: the run of that commit releases what is pending."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v7
        if: steps.head.outputs.current == 'true'
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/multicz-setup
        if: steps.head.outputs.current == 'true'
      - name: Configure git author
        if: steps.head.outputs.current == 'true'
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI, falling back to the github-actions[bot]
        # noreply identity when the payload carries no author.
        env:
          NAME: ${{ github.event.head_commit.author.name }}
          EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        if: steps.head.outputs.current == 'true'
        # Secrets can't be referenced from `if:` directly, so promote
        # their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.head.outputs.current == 'true' && steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase in gpg-agent via a dummy sign so
          # subsequent `git commit -S` / `git tag -s` don't prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          # Derive the signing key id from the imported key; no extra
          # secret needed.
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      - name: Plan release
        if: steps.head.outputs.current == 'true'
        run: multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag, push
        if: steps.head.outputs.current == 'true'
        id: bump
        run: |
          set -euo pipefail
          SIGN=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            SIGN="--sign"
          fi
          PLAN=$(multicz bump --commit --tag $SIGN \
            --summary "$GITHUB_STEP_SUMMARY" --output json)
          if [ "$(jq '.bumps // {} | length' <<<"$PLAN")" -eq 0 ]; then
            echo "nothing to release"
            echo "releases=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release commit and its tags go up in one atomic push. multicz's
          # own --push sends the tags and the branch one after the other: when
          # main had moved on, the tags went through and the branch did not,
          # which left a tag on a commit that is not on main (confirmed for
          # real). Refused as a whole, nothing is left behind and this run
          # stands aside: the run of the commit that landed releases what is
          # pending.
          mapfile -t tags < <(git tag --points-at HEAD)
          refs=()
          for tag in "${tags[@]}"; do refs+=("refs/tags/$tag"); done
          if ! git push --atomic origin HEAD:refs/heads/main "${refs[@]}"; then
            echo "::warning::main moved on while the release was made: nothing was pushed"
            {
              echo "## Release skipped"
              echo
              echo "\`main\` moved on while the release was made: nothing was pushed, and the run of the newer commit releases what is pending."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "releases=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases=""
          for component in $(echo "$PLAN" | jq -r '.bumps // {} | keys | join(" ")'); do
            [ -d "cmd/${component}" ] || continue
            releases="${releases} ${component}:$(multicz get "$component")"
          done
          echo "releases=${releases# }" >> "$GITHUB_OUTPUT"

  # Cross-compile each released binary for linux/amd64 and linux/arm64 and
  # open a GitHub Release per tag, with notes from `multicz release-notes`. The
  # release is a draft: package-complete.yml publishes it once the packages
  # poc-apt builds for it are over, so it is only seen complete.
  publish:
    name: publish
    needs: [release]
    if: needs.release.outputs.releases != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The maintainer token, like the release job: the release is
      # published under the maintainer account, not the bot.
      GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull the release commit and the tags multicz just pushed so the
          # binaries are built from the tagged tree, not the pre-release one.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/multicz-setup
      - name: Build and publish each released component
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for release in $RELEASES; do
            component="${release%%:*}"
            version="${release#*:}"
            tag="${component}-v${version}"
            assets=()
            for goarch in amd64 arm64; do
              out="dist/${component}_${version}_linux_${goarch}"
              GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$out" "./cmd/${component}"
              assets+=("$out")
            done
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file - --draft "${assets[@]}"
          done

  # Dispatches poc-apt and poc-aur's own `publish` workflow for each released
  # component. GITHUB_TOKEN cannot start a workflow run in another
  # repository, so this needs a token of its own - a fine-grained PAT with
  # Contents (read/write) and Actions (read/write) on poc-apt and poc-aur,
  # stored here as CROSS_REPO_TOKEN. Skips gracefully when that secret is
  # unset, the same way the GPG/AUR-key gates do downstream. They report
  # back through package-published.yml once their package is built.
  #
  # poc-apt is also told the Ubuntu series to upload for and the
  # architectures to build, from the PACKAGING_SERIES and PACKAGING_ARCHS
  # repository variables; when they are unset it uses its own defaults.
  trigger-packaging:
    name: trigger packaging
    needs: [release, publish]
    if: needs.release.outputs.releases != ''
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Dispatch the packaging pipelines
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          RELEASES: ${{ needs.release.outputs.releases }}
          SERIES: ${{ vars.PACKAGING_SERIES }}
          ARCHS: ${{ vars.PACKAGING_ARCHS }}
        run: |
          set -uo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-apt/poc-aur were not triggered"
            exit 0
          fi
          failed=0
          # One failed dispatch must not hide the others.
          dispatch() {
            gh workflow run publish.yml "$@" || { echo "::error::could not dispatch $*"; failed=1; }
          }
          for release in $RELEASES; do
            component="${release%%:*}"
            version="${release#*:}"
            dispatch --repo goabonga/poc-apt \
              -f component="$component" -f version="$version" \
              -f series="$SERIES" -f arch="$ARCHS"
            dispatch --repo goabonga/poc-aur \
              -f component="$component" -f version="$version"
          done
          exit "$failed"
