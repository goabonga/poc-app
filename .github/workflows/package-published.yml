name: package-published

# Receives the callback poc-apt/poc-aur send once a component's package has
# actually built (and, when their own publish secrets are configured,
# uploaded to the PPA/AUR). Attaches the result to the GitHub Release
# the ci workflow already created for that component's tag.
#
# client_payload:
#   component: "hello" | "pinger"
#   version:   the released version, e.g. "0.1.0"
#   kind:      "apt" | "aur"
#   url:       the .deb download URL (apt) or the AUR/package page (aur)

on:
  repository_dispatch:
    types: [package-published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMPONENT: ${{ github.event.client_payload.component }}
      VERSION: ${{ github.event.client_payload.version }}
      KIND: ${{ github.event.client_payload.kind }}
      URL: ${{ github.event.client_payload.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Attach the .deb to the release
        if: env.KIND == 'apt'
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag="${COMPONENT}-v${VERSION}"
          asset="poc-${COMPONENT}_${VERSION}_amd64.deb"
          # poc-apt is a private repo too, so this download needs the same
          # cross-repo auth as everything else that reaches across these
          # three repos. The plain browser_download_url doesn't accept a
          # Bearer token at all (404 regardless of -L, confirmed for
          # real) - poc-apt's publish.yml sends the REST API asset
          # endpoint (apiUrl) instead, which needs this Accept header to
          # return the binary rather than its JSON metadata.
          curl -fsSL -H "Authorization: Bearer $CROSS_REPO_TOKEN" \
            -H "Accept: application/octet-stream" -o "$asset" "$URL"
          gh release upload "$tag" "$asset" --clobber

      - name: Link the AUR package in the release notes
        if: env.KIND == 'aur'
        run: |
          set -euo pipefail
          tag="${COMPONENT}-v${VERSION}"
          gh release view "$tag" --json body -q .body > /tmp/body.md
          if ! grep -qF "$URL" /tmp/body.md; then
            printf '\nAlso available on the [AUR](%s).\n' "$URL" >> /tmp/body.md
            gh release edit "$tag" --notes-file /tmp/body.md
          fi
