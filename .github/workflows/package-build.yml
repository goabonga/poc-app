name: package-build

# Receives the callback poc-apt sends once Launchpad has finished building a
# component's package, whatever the outcome. Records it on the GitHub Release
# created for that component's tag and fails when the build did not
# succeed, so a broken package shows up here and not only in poc-apt.
#
# client_payload:
#   component: "hello" | "pinger"
#   version:   the released version, e.g. "0.3.0"
#   kind:      "apt"
#   status:    "success" | "failure" | "timeout"
#   url:       the Launchpad build page
#   log_url:   the build log, empty when there is none

on:
  repository_dispatch:
    types: [package-build]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      COMPONENT: ${{ github.event.client_payload.component }}
      VERSION: ${{ github.event.client_payload.version }}
      KIND: ${{ github.event.client_payload.kind }}
      STATUS: ${{ github.event.client_payload.status }}
      URL: ${{ github.event.client_payload.url }}
      LOG_URL: ${{ github.event.client_payload.log_url }}
    steps:
      - name: Record the build on the release
        run: |
          set -euo pipefail
          [[ "$COMPONENT" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::invalid component"; exit 1; }
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+~-]*$ ]] || { echo "::error::invalid version"; exit 1; }
          tag="${COMPONENT}-v${VERSION}"
          marker="<!-- package-build:${KIND} -->"
          case "$STATUS" in
            success) icon="✅"; text="built on Launchpad" ;;
            *)       icon="❌"; text="Launchpad build ${STATUS}" ;;
          esac
          line="${marker} ${icon} Debian package ${text}: ${URL}"
          if [ -n "$LOG_URL" ] && [ "$STATUS" != "success" ]; then
            line="${line} ([log](${LOG_URL}))"
          fi
          gh release view "$tag" --json body -q .body > body.md
          # One line per kind, replaced on a rerun instead of piling up.
          grep -vF "$marker" body.md > notes.md || true
          printf '\n%s\n' "$line" >> notes.md
          gh release edit "$tag" --notes-file notes.md
          {
            echo "## Package build: ${STATUS}"
            echo
            echo "\`${tag}\` (${KIND}): ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the package did not build
        if: env.STATUS != 'success'
        run: |
          echo "::error::The ${KIND} package of ${COMPONENT} ${VERSION} did not build (${STATUS}): ${URL}"
          exit 1
