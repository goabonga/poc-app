name: release

# Runs after the `ci` workflow finishes green on main:
#   1. plan the release (skip the rest if nothing pending)
#   2. bump the bumped components' version.go + CHANGELOG.md, commit, tag,
#      push (one commit, one tag per component)
#   3. cross-compile each bumped component for linux/amd64 and linux/arm64
#   4. open a GitHub Release per bumped component's tag, with notes from
#      `multicz release-notes --tag` and the two binaries attached
#
# Unsigned: this is a prototype repo with no GPG secrets configured. See
# multicz's own release.yml for the optional-signing pattern if this repo
# ever needs it.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.plan.outputs.bumped }}
    # Only run when CI was green AND the trigger wasn't our own
    # `chore(release)` commit (which would loop forever).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run runs in the context of the default branch, but we
          # want the exact ref that just passed CI. head_branch is always
          # "main" given the trigger filter above.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/multicz-setup

      - name: Configure git
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI.
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Plan
        id: plan
        run: |
          multicz plan --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/plan.json
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/plan.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no release pending"
          fi

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.bumped != ''
        run: |
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Build and publish each bumped component
        if: steps.plan.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for component in ${{ steps.plan.outputs.bumped }}; do
            version=$(multicz get "$component")
            tag="${component}-v${version}"
            mkdir -p dist
            assets=()
            for goarch in amd64 arm64; do
              out="dist/${component}_${version}_linux_${goarch}"
              GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$out" "./cmd/${component}"
              assets+=("$out")
            done
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file - "${assets[@]}"
          done
