name: release

# Runs after the `ci` workflow finishes green on main:
#   1. plan the release (skip the rest if nothing pending)
#   2. bump the bumped components' version.go + CHANGELOG.md, commit, tag,
#      push (one commit, one tag per component)
#   3. cross-compile each bumped component for linux/amd64 and linux/arm64
#   4. open a GitHub Release per bumped component's tag, with notes from
#      `multicz release-notes --tag` and the two binaries attached
#
# The release commit and tags are GPG-signed when GPG_PRIVATE_KEY and
# GPG_PASSPHRASE are configured, and pushed with the maintainer token
# (AUTO_MERGE_PAT) when set, since the main-protection ruleset only lets
# the maintainer push to main. Without them the release falls back to an
# unsigned push with the workflow token.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      bumped: ${{ steps.plan.outputs.bumped }}
    # Only run when CI was green AND the trigger wasn't our own
    # `chore(release)` commit (which would loop forever).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs in the context of the default branch, but we
          # want the exact ref that just passed CI. head_branch is always
          # "main" given the trigger filter above.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # A push made with the workflow token cannot bypass the
          # main-protection ruleset.
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/multicz-setup

      - name: Configure git
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI.
        env:
          NAME: ${{ github.event.workflow_run.head_commit.author.name }}
          EMAIL: ${{ github.event.workflow_run.head_commit.author.email }}
        run: |
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so promote
        # their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase in gpg-agent via a dummy sign so
          # subsequent `git commit -S` / `git tag -s` don't prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          # Derive the signing key id from the imported key; no extra
          # secret needed.
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: Plan
        id: plan
        run: |
          multicz plan --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/plan.json
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/plan.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no release pending"
          fi

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.bumped != ''
        run: |
          SIGN=""
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            SIGN="--sign"
          fi
          multicz bump --commit --tag --push $SIGN \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json

      - name: Build and publish each bumped component
        if: steps.plan.outputs.bumped != ''
        env:
          # The maintainer token, like the push above: the release is
          # published under the maintainer account, not the bot.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || github.token }}
        run: |
          set -euo pipefail
          for component in ${{ steps.plan.outputs.bumped }}; do
            # go-modules is versioned to cascade dependency bumps; it has no
            # binary to build nor release of its own.
            [ -d "cmd/${component}" ] || continue
            version=$(multicz get "$component")
            tag="${component}-v${version}"
            mkdir -p dist
            assets=()
            for goarch in amd64 arm64; do
              out="dist/${component}_${version}_linux_${goarch}"
              GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$out" "./cmd/${component}"
              assets+=("$out")
            done
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file - "${assets[@]}"
          done

      - name: Trigger packaging pipelines
        # Dispatches poc-apt and poc-aur's own `publish` workflow for each
        # bumped component. GITHUB_TOKEN cannot start a workflow run in
        # another repository, so this needs a token of its own - a
        # fine-grained PAT with Contents (read/write) and Actions
        # (read/write) on poc-apt and poc-aur, stored here as
        # CROSS_REPO_TOKEN. Skips gracefully when that secret is unset, the
        # same way the GPG/AUR-key gates do downstream.
        if: steps.plan.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-apt/poc-aur were not triggered"
            exit 0
          fi
          for component in ${{ steps.plan.outputs.bumped }}; do
            [ -d "cmd/${component}" ] || continue
            version=$(multicz get "$component")
            gh workflow run publish.yml --repo goabonga/poc-apt \
              -f component="$component" -f version="$version"
            gh workflow run publish.yml --repo goabonga/poc-aur \
              -f component="$component" -f version="$version"
          done
