# Dependabot v2 configuration.
#
# The commit messages Dependabot produces are placeholders - the
# `dependabot-rewrite` workflow re-classifies each commit by the files it
# touches and rewrites the prefix to the correct Conventional Commits type:
#
#     .github/workflows/*.yml   -> ci:
#     anything else             -> chore(deps):
#
# The rewrite also re-signs the commits with the maintainer's GPG key (via
# `GPG_PRIVATE_KEY` + `GPG_PASSPHRASE`). When those secrets are unset, the PR
# ships unmodified.

version: 2

updates:
  # Go module dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Pinned versions of GitHub Actions in `.github/workflows/*.yml` and the
  # composite actions under `.github/actions/`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "golangci/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
